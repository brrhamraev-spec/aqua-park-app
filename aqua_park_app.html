<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b7fab">
<title>Aqua Park — Mijozlar</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f3f8fb;color:#123}
header{background:#0b7fab;color:white;padding:18px 16px 22px;border-radius:0 0 22px 22px;position:sticky;top:0;z-index:5}
h1{font-size:23px;margin:0 0 14px}.sub{opacity:.9;font-size:13px}
main{max-width:720px;margin:auto;padding:14px 14px 90px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{background:white;border-radius:15px;padding:13px 8px;text-align:center;box-shadow:0 2px 10px #0000000b}.num{font-size:25px;font-weight:800}.label{font-size:11px;color:#687780}
button{border:0;border-radius:12px;padding:12px 14px;font-weight:750;font-size:14px;cursor:pointer}.primary{background:#0b7fab;color:white}.danger{background:#ffe8e8;color:#a40000}.ghost{background:#eaf5fa;color:#086486}
.card{background:white;border-radius:17px;padding:15px;margin-top:12px;box-shadow:0 2px 12px #0000000b}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.name{font-size:17px;font-weight:800}.muted{color:#687780;font-size:13px}.timer{font-size:25px;font-weight:900;margin:10px 0}.finished{color:#b00020}.active{color:#087b3e}.actions{display:flex;gap:8px;flex-wrap:wrap}
nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #dde8ed;display:flex;justify-content:center;gap:4px;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:10}nav button{background:white;color:#48616c;padding:9px 10px;font-size:12px}nav button.sel{background:#e5f4fa;color:#086486}
.modal{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;z-index:20}.sheet{background:white;border-radius:22px 22px 0 0;padding:18px;width:100%;max-height:92vh;overflow:auto}.modal.show{display:flex}
label{font-size:13px;font-weight:700;display:block;margin:10px 0 5px}input,select{width:100%;padding:12px;border:1px solid #cbd9df;border-radius:11px;font-size:16px;background:white}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.empty{text-align:center;padding:30px;color:#71818a}
.alert{position:fixed;top:12px;left:12px;right:12px;background:#fff4cc;border:1px solid #e3b600;padding:14px;border-radius:14px;z-index:30;display:none;box-shadow:0 4px 18px #0003}.alert.show{display:block}
@media(min-width:600px){.sheet{max-width:720px;margin:auto;border-radius:22px}.modal{align-items:center;padding:20px}}
</style>
</head>
<body>
<header><h1>Aqua Park</h1><div class="sub" id="dateText"></div></header>
<main id="app"></main>
<nav>
<button data-page="home" class="sel">🏠 Bosh sahifa</button>
<button data-page="active">⏱ Faol</button>
<button data-page="history">📋 Tarix</button>
</nav>
<div class="modal" id="modal"><div class="sheet">
<div class="row"><h2>Mijoz qo‘shish</h2><button class="ghost" onclick="closeModal()">Yopish</button></div>
<form id="form">
<div class="grid">
<div><label>Ism</label><input id="first" required></div>
<div><label>Familiya</label><input id="last" required></div>
<div><label>Odamlar soni</label><input id="people" type="number" min="1" value="1" required></div>
<div><label>Davomiyligi</label><select id="duration"><option value="1">1 soat</option><option value="2" selected>2 soat</option><option value="3">3 soat</option><option value="4">4 soat</option><option value="custom">Boshqa</option></select></div>
<div class="full" id="customBox" style="display:none"><label>Maxsus davomiylik (daqiqada)</label><input id="custom" type="number" min="1" value="60"></div>
</div>
<button class="primary" style="width:100%;margin-top:15px">Taymerni boshlash</button>
</form></div></div>
<div class="alert" id="alert"></div>
<script>
const KEY='aquapark_v1';
let customers=JSON.parse(localStorage.getItem(KEY)||'[]'), page='home', notified={};
const $=id=>document.getElementById(id);
function save(){localStorage.setItem(KEY,JSON.stringify(customers))}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmt(ms){ms=Math.max(0,ms);let s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return [h,m,x].map((v,i)=>String(v).padStart(2,'0')).join(':')}
function active(){return customers.filter(x=>x.status==='faol' && Date.now()<x.end)}
function render(){
 const inside=active().reduce((a,x)=>a+x.people,0), act=active().length, done=customers.filter(x=>x.status!=='faol'||Date.now()>=x.end).length;
 let list=active();
 if(page==='history') list=customers.filter(x=>x.status!=='faol'||Date.now()>=x.end).slice().reverse();
 let html=`<div class="stats"><div class="stat"><div class="num">${inside}</div><div class="label">Ichkarida</div></div><div class="stat"><div class="num">${act}</div><div class="label">Faol taymer</div></div><div class="stat"><div class="num">${done}</div><div class="label">Tarix</div></div></div>`;
 if(page==='home') html+=`<button class="primary" style="width:100%;margin-top:13px" onclick="openModal()">＋ Mijoz qo‘shish</button><h2>Faol mijozlar</h2>`;
 else if(page==='active') html+=`<h2>Faol mijozlar</h2><button class="primary" onclick="openModal()">＋ Mijoz qo‘shish</button>`;
 else html+=`<h2>Tarix</h2><input id="search" placeholder="Ism yoki familiya bo‘yicha qidirish" oninput="renderHistory()" value="">`;
 html+=`<div id="cards">`;
 if(!list.length) html+=`<div class="card empty">${page==='history'?'Hozircha tarix bo‘sh.':'Faol mijozlar yo‘q.'}</div>`;
 else list.forEach(x=>{let expired=Date.now()>=x.end; html+=card(x,expired)});
 html+=`</div>`;
 $('app').innerHTML=html;
 if(page==='history') renderHistory();
}
function card(x,expired){
 return `<div class="card" data-name="${esc((x.first+' '+x.last).toLowerCase())}">
 <div class="row"><div><div class="name">${esc(x.first)} ${esc(x.last)}</div><div class="muted">${x.people} kishi · Kirish: ${new Date(x.start).toLocaleTimeString('uz-UZ',{hour:'2-digit',minute:'2-digit'})}</div></div><div class="${expired?'finished':'active'}"><b>${expired?'Vaqt tugadi':'Faol'}</b></div></div>
 <div class="muted" style="margin-top:8px">Tugash vaqti: ${new Date(x.end).toLocaleTimeString('uz-UZ',{hour:'2-digit',minute:'2-digit'})}</div>
 <div class="timer ${expired?'finished':''}" id="t-${x.id}">${expired?'00:00:00':fmt(x.end-Date.now())}</div>
 <div class="actions"><button class="danger" onclick="finish('${x.id}')">Sessiyani tugatish</button>${expired?'':'<button class="ghost" onclick="extend(\''+x.id+'\')">+ 1 soat</button>'}</div>
 </div>`
}
function renderHistory(){let q=($('search')?.value||'').toLowerCase();document.querySelectorAll('#cards .card[data-name]').forEach(c=>c.style.display=c.dataset.name.includes(q)?'':'none')}
function tick(){
 let changed=false;
 customers.forEach(x=>{if(x.status==='faol'&&Date.now()>=x.end){x.status='tugadi';x.finishedAt=Date.now();changed=true;if(!notified[x.id]){notified[x.id]=1;showAlert(`${x.first} ${x.last} — vaqti tugadi!`);try{navigator.vibrate?.([300,100,300])}catch(e){}}}});
 if(changed)save();
 document.querySelectorAll('[id^="t-"]').forEach(el=>{let id=el.id.slice(2),x=customers.find(y=>y.id===id);if(x){let expired=Date.now()>=x.end;el.textContent=expired?'00:00:00':fmt(x.end-Date.now());el.classList.toggle('finished',expired)}});
 if(changed||page==='home') render();
}
function finish(id){let x=customers.find(y=>y.id===id);if(!x)return;x.status='tugadi';x.finishedAt=Date.now();save();render()}
function extend(id){let x=customers.find(y=>y.id===id);if(!x)return;x.end+=3600000;x.status='faol';save();render()}
function openModal(){$('modal').classList.add('show')}
function closeModal(){$('modal').classList.remove('show');$('form').reset();$('people').value=1;$('duration').value=2;$('customBox').style.display='none'}
$('duration').onchange=()=>{$('customBox').style.display=$('duration').value==='custom'?'block':'none'}
$('form').onsubmit=e=>{e.preventDefault();let d=$('duration').value==='custom'?Number($('custom').value)/60:Number($('duration').value);if(!d||d<=0)return;let start=Date.now(),x={id:crypto.randomUUID(),first:$('first').value.trim(),last:$('last').value.trim(),people:Number($('people').value),start,end:start+d*3600000,status:'faol'};customers.push(x);save();closeModal();page='home';selectNav();render()}
function showAlert(t){$('alert').textContent='🔔 '+t;$('alert').classList.add('show');setTimeout(()=>$('alert').classList.remove('show'),8000)}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{page=b.dataset.page;selectNav();render()});
function selectNav(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('sel',b.dataset.page===page))}
$('dateText').textContent=new Date().toLocaleDateString('uz-UZ',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
render();setInterval(tick,1000);
if('Notification'in window&&Notification.permission==='default')setTimeout(()=>Notification.requestPermission(),1500);
</script>
</body>
</html>
